name: Metricas cron jobs

on:
  schedule:
    - cron: "*/15 * * * *" # unica entrada -- ver nota abaixo
  workflow_dispatch:
    inputs:
      backfill_company_id:
        description: "company_id (uuid) para carga retroativa de pedidos -- deixe vazio pra so rodar o ciclo normal"
        required: false
      backfill_from:
        description: "Data inicial (YYYY-MM-DD) da carga retroativa"
        required: false
      backfill_to:
        description: "Data final (YYYY-MM-DD) da carga retroativa"
        required: false

jobs:
  # As 3 rotinas rodam juntas a cada disparo (a cada ~15min, sujeito ao
  # throttling do GitHub Actions em schedules). Antes cada uma tinha seu
  # proprio "cron:" e um "if: github.event.schedule == '<string exata>'" --
  # na pratica, so a entrada "*/15 * * * *" chegou a disparar em 23 execucoes
  # reais (28/08 a 31/08): as entradas diarias ("5 3 * * *", "20 3 * * *")
  # nunca casaram e os jobs aggregate/alerts sempre vieram "skipped", entao
  # listing_daily_snapshot nunca foi populada. aggregate e alerts sao
  # idempotentes (aggregate sempre reprocessa o dia de "ontem" via upsert),
  # entao rodar com mais frequencia do que o pretendido e inofensivo -- so
  # garante que rodem de verdade.
  ml-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar contas Mercado Livre
        run: |
          curl -sS -f -X POST "https://metricas-v2-api.onrender.com/api/v1/cron/ml-sync-all" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" --max-time 120

  # Mesma coisa, canal Magalu -- fica sem efeito ate a integracao ter uma
  # conta de verdade conectada (endpoint so processa empresas com conta
  # Magalu status=connected).
  magalu-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar contas Magalu
        run: |
          curl -sS -f -X POST "https://metricas-v2-api.onrender.com/api/v1/cron/magalu-sync-all" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" --max-time 120

  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Agregar snapshot diario
        run: |
          curl -sS -f -X POST "https://metricas-v2-api.onrender.com/api/v1/cron/listing-daily-snapshot-aggregate-all" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" --max-time 120

  visits-sync:
    needs: aggregate
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar visitas do dia anterior
        run: |
          curl -sS -f -X POST "https://metricas-v2-api.onrender.com/api/v1/cron/visits-sync-all" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" --max-time 300

  alerts:
    needs: aggregate
    runs-on: ubuntu-latest
    steps:
      - name: Avaliar regras de alerta
        run: |
          curl -sS -f -X POST "https://metricas-v2-api.onrender.com/api/v1/cron/alerts-evaluate-all" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" --max-time 120

  orders-backfill:
    if: github.event_name == 'workflow_dispatch' && inputs.backfill_company_id != ''
    runs-on: ubuntu-latest
    steps:
      - name: Carga retroativa de pedidos
        run: |
          curl -sS -f -X POST "https://metricas-v2-api.onrender.com/api/v1/cron/orders-backfill" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "content-type: application/json" \
            -d "{\"companyId\":\"${{ inputs.backfill_company_id }}\",\"from\":\"${{ inputs.backfill_from }}\",\"to\":\"${{ inputs.backfill_to }}\"}" \
            --max-time 300

  # Reagrega o mes corrente inteiro (nao so ontem) 1x por dia, as 5h em
  # America/Sao_Paulo (UTC-3 fixo -- 08h UTC). O disparo "*/15 * * * *" roda
  # o tempo todo; o horario exato de execucao dentro do job e quem decide se
  # de fato chama a API -- checagem de relogio no proprio shell, nao um
  # "if: github.event.schedule == ..." (essa comparacao de string ja se
  # provou nao confiavel entre varias entradas de cron nesse workflow, ver
  # nota do job "ml-sync" acima).
  month-aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Reagregar mes corrente (so as 5h America/Sao_Paulo)
        run: |
          hour="$(TZ=America/Sao_Paulo date +%H)"
          if [ "$hour" != "05" ]; then
            echo "Fora da janela das 5h (hora atual: $hour) -- pulando."
            exit 0
          fi
          curl -sS -f -X POST "https://metricas-v2-api.onrender.com/api/v1/cron/listing-daily-snapshot-aggregate-month-all" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" --max-time 600

  # Atualiza o dia corrente (agregacao + visitas) 1x por hora -- mesma logica
  # de checagem de relogio: dispara a cada ~15min, mas so chama a API no
  # primeiro tick de cada hora (minuto < 15).
  today-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar dia corrente (so no primeiro tick de cada hora)
        run: |
          minute="$(date +%M | sed 's/^0*//')"
          if [ -n "$minute" ] && [ "$minute" -ge 15 ]; then
            echo "Fora da janela do primeiro tick da hora (minuto atual: $minute) -- pulando."
            exit 0
          fi
          curl -sS -f -X POST "https://metricas-v2-api.onrender.com/api/v1/cron/today-refresh-all" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" --max-time 300
